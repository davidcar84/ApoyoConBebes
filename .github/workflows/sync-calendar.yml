name: Sync Google Calendar

on:
  schedule:
    - cron: '0 11 * * *' # diario, 11:00 UTC (~6:00 AM Bogotá)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Sync calendar to Firebase
        working-directory: scripts
        run: node sync-calendar.mjs
        env:
          CALENDAR_ICS_URL: https://calendar.google.com/calendar/ical/fef5f71c72ab424580b26257600f40f6bffb78833ff7f5f5bdf26927f9bf71ea%40group.calendar.google.com/public/basic.ics
